name: Godot validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Godot
        run: |
          curl --fail --location --retry 2 --output /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  /tmp/godot.zip" | sha512sum --check --status
          unzip -q /tmp/godot.zip -d /tmp/godot
          echo "/tmp/godot" >> "$GITHUB_PATH"
      - name: Import and test
        run: |
          set -euo pipefail
          engine="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "$engine" --headless --path . --editor --import 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/import.log; then exit 1; fi
          "$engine" --headless --path . --script tests/test_simulation.gd
          "$engine" --headless --path . --script tests/test_utility_network.gd
          "$engine" --headless --path . --script tests/test_scene.gd

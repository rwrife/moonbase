name: Bug report
description: Report a reproducible gameplay or project setup problem.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the starting scenario and exact actions.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Commit, Godot version, OS, renderer, and browser if Web.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and supporting evidence
      description: Remove credentials and personal data before sharing.
